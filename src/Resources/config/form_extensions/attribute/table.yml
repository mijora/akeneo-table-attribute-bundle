# Parameters of the table attributes in the "Properties" tab of the attribute form, registered for the
# flagbit_catalog_table type in requirejs.yml, as the PIM shows its "Usable in grid" field from the form of each type
extensions:
    flagbit-attribute-form-table:
        module: pim/common/simple-view
        config:
            template: pim/template/common/drop-zone

    flagbit-attribute-form-table-type-specific-params:
        module: pim/common/simple-view
        parent: flagbit-attribute-form-table
        targetZone: content
        position: 100
        config:
            template: pim/template/form/tab/section
            templateParams:
                sectionTitle: pim_enrich.entity.attribute.module.edit.type_specific
                dropZone: content

    flagbit-attribute-form-table-usable-as-grid-filter:
        module: pim/form/common/fields/boolean
        parent: flagbit-attribute-form-table-type-specific-params
        targetZone: content
        position: 70
        config:
            fieldName: useable_as_grid_filter
            label: pim_enrich.entity.attribute.property.useable_as_grid_filter
